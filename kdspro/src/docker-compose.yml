version: '3.8'

# Definición de servicios para el ecosistema KDS (Módulo Infraestructura - Mes 1 y 2).
services:
  mongodb:
    image: mongo:latest
    container_name: kds-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      # Nombre de la base de datos inicial
      MONGO_INITDB_DATABASE: KDS

  kds-api:
    build:
      context: .
      dockerfile: kdspro.Api/Dockerfile
    container_name: kds-backend
    ports:
      - "5162:8080" # Mapeamos tu puerto 5162 al puerto interno del contenedor
    depends_on:
      - mongodb
    environment:
      # SINCRONIZACIÓN: Estas claves coinciden con tu MongoDbContext.cs
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=KDS
      - ASPNETCORE_ENVIRONMENT=Development

volumes:
  mongo_data:

